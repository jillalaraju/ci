name: Node.js CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      # ------------------------------------------------------
      # STEP 1 → CHECKOUT CODE
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4



      - name: Check current directory
        run: pwd

      - name: List files
        run: ls -la ./node
